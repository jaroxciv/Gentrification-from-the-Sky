[project]
name = "gentrification-from-the-sky"
version = "0.1.0"
description = "Measuring urban gentrification in Greater London from open Sentinel-2 satellite imagery using deep-learning change detection and machine learning."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Javier Alfaro" },
    { name = "Sanja Šćepanović" },
    { name = "Stephen Law" },
    { name = "Daniele Quercia" },
]
keywords = ["remote-sensing", "gentrification", "change-detection", "machine-learning", "sentinel-2", "urban"]

dependencies = [
    # scientific core
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    # geospatial
    "geopandas>=1.0",
    "rasterio>=1.3",
    "rioxarray>=0.17",
    "shapely>=2.0",
    "pyproj>=3.6",
    "fiona>=1.10",
    # remote sensing / Earth Engine
    "earthengine-api>=1.0",
    "geemap>=0.34",
    # deep learning + change detection
    "torch>=2.4",
    "torchvision>=0.19",
    "scikit-image>=0.24",
    # downstream modeling
    "xgboost>=2.1",
    "imbalanced-learn>=0.12",
    # viz
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "contextily>=1.6",
    # utils
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    # data access (Dropbox helpers)
    "dropbox>=12.0",
    "typer>=0.26.5",
    "rich>=15.0.0",
]

[project.optional-dependencies]
# Extras that pull large or finicky dependency trees; install on demand.
benchmark = ["lazypredict>=0.2.12"]  # broad model comparison (used in ablation)

[project.urls]
Homepage = "https://github.com/jaroxciv/Gentrification-from-the-Sky"
Paper = "https://doi.org/10.1007/cupum-2025"  # CUPUM 2025 book chapter

[dependency-groups]
dev = [
    "basedpyright>=1.39.6",
    "ruff>=0.6",
    "nbstripout>=0.7",
    "pytest>=9.0.3",
    "pre-commit>=4.6.0",
]

# Keep torch on the CPU wheels by default (smaller, no CUDA toolkit needed).
# Users with a GPU can override this index.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gfs"]

[tool.basedpyright]
# The geospatial / Earth Engine / torch stack ships limited type info, which
# makes basedpyright's default "recommended" mode emit a flood of reportUnknown*
# noise. "standard" keeps real type errors while silencing that noise.
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter
