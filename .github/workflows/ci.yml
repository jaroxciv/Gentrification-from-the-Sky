name: CI

on:
  push:
    branches: [main, repo-reorg]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (basedpyright)
        run: uv run basedpyright src/ scripts/ tests/

      - name: Tests (pytest)
        run: uv run pytest -q
