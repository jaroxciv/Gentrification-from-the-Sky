<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="'Inter','Segoe UI',system-ui,sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0b1222"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1180" height="560" fill="url(#bg)"/>

  <!-- title -->
  <text x="40" y="44" font-size="24" font-weight="700" fill="#f1f5f9">Gentrification from the Sky</text>
  <text x="40" y="68" font-size="14" fill="#94a3b8">Remote sensing + machine-learning pipeline · the <tspan font-family="ui-monospace,monospace" fill="#a78bfa">gfs</tspan> package</text>

  <!-- lane tags -->
  <text x="250" y="100" font-size="11" font-weight="700" letter-spacing="1.5" fill="#38bdf8">X · SATELLITE IMAGERY</text>
  <text x="250" y="384" font-size="11" font-weight="700" letter-spacing="1.5" fill="#34d399">Y · CENSUS</text>

  <!-- ===== edges ===== -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M212,150 L248,150" marker-end="url(#arrow)"/>
    <path d="M437,150 L473,150" marker-end="url(#arrow)"/>
    <path d="M662,150 L698,150" marker-end="url(#arrow)"/>
    <path d="M212,430 L248,430" marker-end="url(#arrow)"/>
    <path d="M437,434 L473,434" marker-end="url(#arrow)"/>
    <path d="M792,194 L792,248" marker-end="url(#arrow)"/>
    <path d="M662,434 L760,434 L760,338" marker-end="url(#arrow)"/>
    <path d="M887,292 L923,292" marker-end="url(#arrow)"/>
  </g>
  <!-- Dynamic World feeds change detection (green mask) -->
  <path d="M212,280 C360,280 405,186 472,180" stroke="#34d399" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>
  <text x="330" y="238" font-size="10" fill="#34d399" font-style="italic">green-areas mask</text>

  <!-- ===== source chips ===== -->
  <g filter="url(#shadow)">
    <rect x="42" y="120" width="170" height="60" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <rect x="42" y="250" width="170" height="60" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <rect x="42" y="400" width="170" height="60" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle">
    <text x="127" y="146" font-size="13" font-weight="600" fill="#e2e8f0">Sentinel-2 L2A</text>
    <text x="127" y="165" font-size="11" fill="#94a3b8">STAC · WASDI</text>
    <text x="127" y="276" font-size="13" font-weight="600" fill="#e2e8f0">Dynamic World</text>
    <text x="127" y="295" font-size="11" fill="#94a3b8">Earth Engine</text>
    <text x="127" y="426" font-size="13" font-weight="600" fill="#e2e8f0">ONS Census + IMD</text>
    <text x="127" y="445" font-size="11" fill="#94a3b8">age · edu · housing · income</text>
  </g>

  <!-- ===== top lane (X) ===== -->
  <g filter="url(#shadow)">
    <rect x="250" y="108" width="187" height="84" rx="12" fill="#0c3149" stroke="#38bdf8" stroke-width="2"/>
    <rect x="475" y="108" width="187" height="84" rx="12" fill="#2a1758" stroke="#a78bfa" stroke-width="2"/>
    <rect x="700" y="108" width="184" height="84" rx="12" fill="#0a3543" stroke="#22d3ee" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <text x="343" y="138" font-size="14" font-weight="700" fill="#e0f2fe">Composites</text>
    <text x="343" y="158" font-size="11" fill="#7dd3fc">median · 11 bands @ 10 m</text>
    <text x="343" y="176" font-size="11" font-family="ui-monospace,monospace" fill="#38bdf8">gfs.composites</text>

    <text x="568" y="138" font-size="14" font-weight="700" fill="#ede9fe">Change detection</text>
    <text x="568" y="158" font-size="11" fill="#c4b5fd">6 deep models · §3.3</text>
    <text x="568" y="176" font-size="11" font-family="ui-monospace,monospace" fill="#a78bfa">gfs.change_detection</text>

    <text x="792" y="138" font-size="14" font-weight="700" fill="#cffafe">LSOA aggregation</text>
    <text x="792" y="158" font-size="11" fill="#67e8f9">Φ feature matrix · §3.5</text>
    <text x="792" y="176" font-size="11" font-family="ui-monospace,monospace" fill="#22d3ee">gfs.modeling.features</text>
  </g>

  <!-- ===== bottom lane (Y) ===== -->
  <g filter="url(#shadow)">
    <rect x="250" y="392" width="187" height="84" rx="12" fill="#05321c" stroke="#34d399" stroke-width="2"/>
    <rect x="475" y="392" width="187" height="84" rx="12" fill="#05321c" stroke="#34d399" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <text x="343" y="422" font-size="14" font-weight="700" fill="#d1fae5">Gentrification score</text>
    <text x="343" y="442" font-size="11" fill="#6ee7b7">neighborhood index · §3.1</text>
    <text x="343" y="460" font-size="11" font-family="ui-monospace,monospace" fill="#34d399">gfs.gentrification</text>

    <text x="568" y="422" font-size="14" font-weight="700" fill="#d1fae5">Binarize target</text>
    <text x="568" y="442" font-size="11" fill="#6ee7b7">disadvantaged · quartiles</text>
    <text x="568" y="460" font-size="11" fill="#6ee7b7">§4.1</text>
  </g>

  <!-- ===== modeling + outputs ===== -->
  <g filter="url(#shadow)">
    <rect x="700" y="250" width="187" height="84" rx="12" fill="#3a2106" stroke="#fbbf24" stroke-width="2"/>
    <rect x="923" y="250" width="187" height="84" rx="12" fill="#4a0a1c" stroke="#fb7185" stroke-width="2"/>
  </g>
  <g text-anchor="middle">
    <text x="793" y="280" font-size="14" font-weight="700" fill="#fef3c7">Modeling</text>
    <text x="793" y="300" font-size="11" fill="#fcd34d">LogReg · SVC · XGBoost</text>
    <text x="793" y="318" font-size="11" font-family="ui-monospace,monospace" fill="#fbbf24">gfs.modeling</text>

    <text x="1016" y="280" font-size="14" font-weight="700" fill="#ffe4e6">Predictions + maps</text>
    <text x="1016" y="300" font-size="11" fill="#fda4af">balanced accuracy ~0.77</text>
    <text x="1016" y="318" font-size="11" font-family="ui-monospace,monospace" fill="#fb7185">gfs.viz</text>
  </g>

  <!-- footer -->
  <text x="40" y="536" font-size="11" fill="#64748b">Greater London · Sentinel-2 2016/2021 · census 2011/2021 · CUPUM 2025</text>
</svg>
